# 本地可复现：使用内嵌 H2 内存库，不依赖任何外部服务
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:mem:billing;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# 锁等待上限，避免并发写入时长时间阻塞
spring.jpa.properties.hibernate.lock_timeout=3000
spring.jpa.properties.jakarta.persistence.lock.timeout=3000
# 本地观察 SQL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.com.github.lisama569.usagebillingenginejava=INFO
